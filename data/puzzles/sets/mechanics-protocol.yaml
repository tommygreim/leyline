name: mechanics-protocol
description: Focused protocol-mechanic acceptance scenarios promoted from manual puzzles.
scenarios:
  - id: inti-optional-discard
    puzzle: inti-optional-discard
    run: attack with Grizzly Bears, discard Mountain to Inti, then target the attacker
    expect: Inti discards before targeting and the attacker receives its counter
    steps:
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 12
      - attack: { cards: [Grizzly Bears] }
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 4482 }
          max_passes: 12
      - select_cost: { zone: hand, cards: [Mountain] }
      - target: { side: ours, zone: battlefield, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Mountain }
            - battlefield_stats_at_least: { side: ours, card: Grizzly Bears, power: 3, toughness: 3 }
            - stack_empty: true
  - id: opening-hand-battlefield-put
    deck: [30 Leyline Axe, 30 Forest]
    opponent_deck: [60 Plains]
    native: { skip: constructed-deck startup is not puzzle injectable }
    run: keep an opening hand containing Leyline Axe
    expect: Leyline Axe begins the first main phase on the battlefield through the opening-hand action lifecycle
    steps:
      - expect:
          all:
            - phase: MAIN1
            - zone_contains: { side: ours, zone: battlefield, card: Leyline Axe }
            - annotation_seen:
                type: UserActionTaken
                details: { actionType: 15, abilityGrpId: 175903 }
  - id: llanowar-elves-mana
    puzzle: llanowar-elves-mana
    run: cast Grizzly Bears with Llanowar Elves as the required second mana source
    expect: the Elf taps for green and Grizzly Bears resolves
    steps:
      - expect:
          action: { type: cast, card: Grizzly Bears }
      - cast: Grizzly Bears
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: AbilityInstanceCreated
            - annotation_seen: TappedUntappedPermanent
            - annotation_seen: ManaPaid
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - stack_empty: true
  - id: paradigm-germination-main1-copy
    puzzle: paradigm-germination-live
    run: cast Germination Practicum, then cast its recurring copy during the next Main1 trigger
    expect: the Paradigm copy is offered in Main1, casts from exile for free, and self-exiles again
    steps:
      - expect:
          action: { type: cast, card: Germination Practicum }
      - cast: Germination Practicum
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: exile, card: Germination Practicum }
            - stack_empty: true
      - pass_until:
          annotation_seen_in_phase: { type: AbilityInstanceCreated, phase: MAIN1 }
          max_passes: 30
      - expect:
          all:
            - annotation_seen_in_phase: { type: AbilityInstanceCreated, phase: MAIN1 }
            - annotation_seen: UserActionTaken
            - zone_contains: { side: ours, zone: exile, card: Germination Practicum }
            - stack_empty: true
  - id: mdfc-silundi-front-spell
    puzzle: mdfc-silundi-front-spell
    run: cast Silundi Vision as its front spell face
    expect: Silundi Vision resolves from stack to graveyard through the normal Cast path
    steps:
      - expect:
          action: { type: cast, card: Silundi Vision }
      - cast: Silundi Vision
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Silundi Vision }
            - stack_empty: true
  - id: mdfc-silundi-land
    puzzle: mdfc-silundi-land
    run: play Silundi Vision as its land face
    expect: Silundi Isle moves from hand to battlefield through PlayMdfc
    steps:
      - expect:
          action: { type: play_mdfc, card: Silundi Vision }
      - play_mdfc: Silundi Vision
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Silundi Isle }
            - zone_not_contains: { side: ours, zone: hand, card: Silundi Vision }
  - id: mdfc-esika-back-spell
    puzzle: mdfc-esika-back-spell
    run: cast Esika as The Prismatic Bridge
    expect: The Prismatic Bridge resolves to the battlefield through CastMdfc
    steps:
      - expect:
          action: { type: cast_mdfc, card: Esika, God of the Tree }
      - cast_mdfc: Esika, God of the Tree
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: The Prismatic Bridge }
            - stack_empty: true
  - id: snow-mana-ascendant-spirit
    puzzle: snow-mana-ascendant-spirit
    run: activate Ascendant Spirit using snow mana
    expect: Ascendant Spirit becomes at least 2/3 after the snow activation resolves
    steps:
      - expect:
          action: { type: activate, card: Ascendant Spirit }
      - activate: { card: Ascendant Spirit, ability_index: 0 }
      - resolve_stack: {}
      - expect:
          all:
            - battlefield_stats_at_least: { side: ours, card: Ascendant Spirit, power: 2, toughness: 3 }
            - stack_empty: true
  - id: crew-vehicle
    puzzle: vehicle-crew
    run: crew Brute Suit with Centaur Courser in Main1
    expect: Brute Suit becomes a creature before combat advances
    steps:
      - expect:
          action: { type: activate, card: Brute Suit }
      - activate: Brute Suit
      - select_cost: { zone: battlefield, cards: [Centaur Courser] }
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen_in_phase: { type: ModifiedType, phase: MAIN1 }
            - stack_empty: true
  - id: saddle-drover-grizzly
    puzzle: saddle-drover-grizzly
    run: saddle Drover Grizzly with Grizzly Bears, then attack
    expect: saddle tap payment resolves and attack moves to combat
    steps:
      - expect:
          action: { type: activate, card: Drover Grizzly }
      - activate: Drover Grizzly
      - select_cost: { zone: battlefield, cards: [Grizzly Bears] }
      - resolve_stack: {}
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 12
      - attack_all: {}
      - expect:
          stack_empty: true
  - id: coin-flip-tavern-swindler
    puzzle: tavern-swindler-coin-flip
    run: activate Tavern Swindler and resolve its coin flip
    expect: the activation resolves and emits a CoinFlip annotation
    steps:
      - expect:
          action: { type: activate, card: Tavern Swindler }
      - activate: Tavern Swindler
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: CoinFlip
            - stack_empty: true
  - id: exhaust-jeong-jeong
    puzzle: exhaust-jeong-jeong
    run: activate Jeong Jeong's exhaust ability
    expect: the activation resolves and emits an AbilityExhausted marker
    steps:
      - expect:
          action: { type: activate, card: "Jeong Jeong, the Deserter" }
      - activate: "Jeong Jeong, the Deserter"
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: AbilityExhausted
            - stack_empty: true
  - id: power-up-serpent-specialist
    puzzle: power-up-serpent-specialist
    run: wait until the starting Serpent Specialist is not newly entered, then activate Power Up once for its full cost
    expect: Serpent Specialist becomes exactly 3/3 and its Power Up ability is exhausted
    steps:
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 30
      - attack_all: {}
      - pass_until:
          phase: MAIN1
          max_passes: 30
      - expect:
          action: { type: activate, card: Serpent Specialist }
      - activate: { card: Serpent Specialist, ability_grp_id: 206280 }
      - pass_until:
          battlefield_stats: { side: ours, card: Serpent Specialist, power: 3, toughness: 3 }
          max_passes: 12
      - expect:
          all:
            - battlefield_stats: { side: ours, card: Serpent Specialist, power: 3, toughness: 3 }
            - annotation_seen:
                type: AbilityExhausted
                details: { AbilityGrpId: 206280, UsesRemaining: 0 }
            - stack_empty: true
  - id: boast-usher-of-the-fallen
    puzzle: boast-usher-of-the-fallen
    run: attack with Usher of the Fallen, then activate Boast
    expect: the Boast activation resolves, creates a Human Warrior token, and emits AbilityExhausted
    steps:
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 30
      - attack_all: {}
      - expect:
          action: { type: activate, card: Usher of the Fallen }
      - activate: Usher of the Fallen
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: AbilityExhausted
            - annotation_seen: TokenCreated
            - zone_contains: { side: ours, zone: battlefield, card: Human Warrior Token }
            - stack_empty: true
  - id: case-gateway-express-lifecycle
    puzzle: case-gateway-express-lifecycle
    run: attack with three Savannah Lions and advance to the Case solve trigger
    expect: solve progress reaches three, the solve ability resolves, and the solved power effect is emitted
    steps:
      - expect:
          battlefield_stats: { side: ours, card: Savannah Lions, power: 2, toughness: 1 }
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 12
      - attack_all: {}
      - pass_until:
          annotation_seen:
            type: ResolutionComplete
            details: { grpid: 170350 }
          max_passes: 20
      - expect:
          all:
            - annotation_seen:
                type: AbilityWordActive
                details: { AbilityWordName: ToSolveCondition, value: 3, threshold: 3, AbilityGrpId: 170350 }
            - annotation_seen: ModifiedPower
            - annotation_seen: LayeredEffect
            - annotation_seen:
                type: Designation
                details: { DesignationType: 15 }
  - id: extinction-event-parity-choice
    puzzle: extinction-event-choice
    run: cast Extinction Event and choose even
    expect: Grizzly Bears is exiled and Serra Angel remains on the battlefield
    steps:
      - expect:
          action: { type: cast, card: Extinction Event }
      - cast: Extinction Event
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 23 }
          max_passes: 8
      - static_choice: { id: 0 }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: opponent, zone: battlefield, card: Grizzly Bears }
            - zone_contains: { side: opponent, zone: battlefield, card: Serra Angel }
            - zone_contains: { side: ours, zone: graveyard, card: Extinction Event }
            - stack_empty: true
  - id: ward-tax
    puzzle: try-ward-vren
    run: cast Lightning Bolt targeting Vren and pay Ward 2
    expect: ward tax path resolves without countering the spell submission
    steps:
      - expect:
          action: { type: cast, card: Lightning Bolt }
      - cast: Lightning Bolt
      - target: { side: opponent, zone: battlefield, card: "Vren, the Relentless" }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Lightning Bolt }
            - stack_empty: true
  - id: suspected-frantic-scapegoat
    puzzle: suspected-frantic-scapegoat
    web:
      skip: Browser runner does not reach the expected board state for this mechanic — deterministic gap on the per-mechanic ledger.
    run: cast Frantic Scapegoat, then suspect Grizzly Bears when it enters
    expect: the Suspected designation moves from Scapegoat to Grizzly Bears
    steps:
      - expect:
          action: { type: cast, card: Frantic Scapegoat }
      - cast: Frantic Scapegoat
      - resolve_stack: {}
      - expect:
          annotation_seen: Designation
      - expect:
          action: { type: cast, card: Grizzly Bears }
      - cast: Grizzly Bears
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 12761 }
          max_passes: 8
      - select_card: { side: ours, zone: battlefield, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: GainDesignation
            - annotation_seen: LoseDesignation
            - zone_contains: { side: ours, zone: battlefield, card: Frantic Scapegoat }
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - stack_empty: true
  - id: duress-reveal-discard
    puzzle: duress-reveal
    run: cast Duress and choose Murder from the revealed opponent hand
    expect: Murder moves from opponent hand to opponent graveyard
    native:
      skip: Headless-only for now; the native SelectN reveal-hand UI is not driven yet.
    steps:
      - expect:
          action: { type: cast, card: Duress }
      - cast: Duress
      - pass_until:
          prompt: SelectNReq
          max_passes: 8
      - select_card: { side: opponent, zone: hand, card: Murder }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: opponent, zone: graveyard, card: Murder }
            - zone_not_contains: { side: opponent, zone: hand, card: Murder }
  - id: deep-cavern-bat-reveal-exile
    puzzle: deep-cavern-bat-reveal-exile
    run: cast Deep-Cavern Bat and choose Divination from the revealed opponent hand
    expect: Divination leaves opponent hand and Deep-Cavern Bat remains on battlefield
    steps:
      - expect:
          action: { type: cast, card: Deep-Cavern Bat }
      - cast: Deep-Cavern Bat
      - pass_until:
          prompt: SelectNReq
          max_passes: 8
      - select_card: { side: opponent, zone: hand, card: Divination }
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: CardRevealed
            - annotation_seen: InstanceRevealedToOpponent
            - zone_not_contains: { side: opponent, zone: hand, card: Divination }
            - zone_contains: { side: ours, zone: battlefield, card: Deep-Cavern Bat }
  - id: stock-up-bottom-order
    puzzle: stock-up
    run: cast Stock Up, choose two cards, then order the unchosen cards on bottom
    expect: Stock Up emits SelectNReq 2490 followed by bottom OrderReq 42 and resolves
    steps:
      - expect:
          action: { type: cast, card: Stock Up }
      - cast: Stock Up
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 2490 }
          max_passes: 8
      - select_cards: { zone: library, cards: [Lightning Bolt, Counterspell] }
      - expect:
          prompt: { type: OrderReq, prompt_id: 42 }
      - order_cards: [Negate, Brainstorm, Ponder]
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Lightning Bolt }
            - zone_contains: { side: ours, zone: hand, card: Counterspell }
            - zone_contains: { side: ours, zone: graveyard, card: Stock Up }
            - stack_empty: true
  - id: brainstorm-top-order
    puzzle: brainstorm-order
    run: cast Brainstorm, choose two hand cards, then order them on top
    expect: Brainstorm emits SelectNReq 2035 followed by top OrderReq 86 and resolves
    steps:
      - expect:
          action: { type: cast, card: Brainstorm }
      - cast: Brainstorm
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 2035 }
          max_passes: 8
      - select_cards: { zone: hand, cards: [Island, Forest] }
      - expect:
          prompt: { type: OrderReq, prompt_id: 86 }
      - order_cards: [Forest, Island]
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Lightning Bolt }
            - zone_contains: { side: ours, zone: graveyard, card: Brainstorm }
            - stack_empty: true
  - id: unearth-gixian-recycler
    puzzle: unearth-gixian-recycler
    run: cast Gixian Recycler, destroy it, then unearth it from graveyard
    expect: Recycler returns from graveyard to battlefield
    steps:
      - expect:
          action: { type: cast, card: Gixian Recycler }
      - cast: Gixian Recycler
      - resolve_stack: {}
      - cast: Lightning Bolt
      - target: { side: ours, zone: battlefield, card: Gixian Recycler }
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: graveyard, card: Gixian Recycler }
      - activate: { card: Gixian Recycler, zone: graveyard }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Gixian Recycler }
            - stack_empty: true
  - id: cascade-bloodbraid
    puzzle: cascade-bloodbraid
    run: cast Bloodbraid Elf, accept the cascaded Llanowar Elves cast
    expect: both Bloodbraid Elf and Llanowar Elves resolve to battlefield
    steps:
      - expect:
          action: { type: cast, card: Bloodbraid Elf }
      - cast: Bloodbraid Elf
      - cast: { card: Llanowar Elves, zone: exile }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Bloodbraid Elf }
            - zone_contains: { side: ours, zone: battlefield, card: Llanowar Elves }
  - id: discover-geological-appraiser
