  - id: discover-hidden-courtyard
    puzzle: discover-hidden-courtyard
    run: activate Hidden Courtyard, accept the discovered Llanowar Elves cast
    expect: Hidden Courtyard is sacrificed and Llanowar Elves resolves to the battlefield
    steps:
