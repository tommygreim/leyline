  - id: bargain-rowans-grim-search
    puzzle: try-bargain-rowans
    run: cast Rowan's Grim Search with Bargain by sacrificing Manalith
    expect: Manalith is sacrificed and the spell resolves
    steps:
      - expect:
          action: { type: cast, card: Rowan's Grim Search }
      - cast: Rowan's Grim Search
      - choose: { optional_cost: bargain }
      - select_cost: { zone: battlefield, cards: [Manalith] }
      - expect:
