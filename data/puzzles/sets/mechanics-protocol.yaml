            - zone_contains: { side: ours, zone: graveyard, card: Manalith }
            - zone_not_contains: { side: ours, zone: hand, card: Rowan's Grim Search }
  - id: casualty-cut-your-losses
    puzzle: try-casualty-cut-your-losses
    run: cast Cut Your Losses with Casualty by sacrificing Grizzly Bears
    expect: sacrifice payment resolves and the spell leaves hand
    steps:
      - expect:
          action: { type: cast, card: Cut Your Losses }
      - cast: Cut Your Losses
      - choose: { optional_cost: casualty }
      - target: opponent
      - select_cost: { zone: battlefield, cards: [Grizzly Bears] }
      - target: opponent
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Grizzly Bears }
            - zone_not_contains: { side: ours, zone: hand, card: Cut Your Losses }
            - stack_empty: true
  - id: casualty-make-disappear-stack-spells
    puzzle: make-disappear-own-stack-casualty
    headless: { full_control: true }
    web:
      skip: Browser runner does not reach the expected board state for this mechanic — deterministic gap on the per-mechanic ledger.
    run: cast Shock, Lightning Bolt, then Make Disappear with Casualty to counter both stack spells
    expect: both burn spells are countered and opponent life remains unchanged
    steps:
      - expect:
          action: { type: cast, card: Shock }
      - cast: Shock
      - target: opponent
      - expect:
          action: { type: cast, card: Lightning Bolt }
      - cast: Lightning Bolt
      - target: opponent
      - expect:
          action: { type: cast, card: Make Disappear }
      - cast: Make Disappear
      - choose: { optional_cost: casualty }
      - target: { side: ours, zone: stack, card: Lightning Bolt }
      - select_cost: { zone: battlefield, cards: [Grizzly Bears] }
      - pass_until:
          prompt: SelectTargetsReq
          max_passes: 4
      - target: { side: ours, zone: stack, card: Shock }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Shock }
            - zone_contains: { side: ours, zone: graveyard, card: Lightning Bolt }
            - zone_contains: { side: ours, zone: graveyard, card: Make Disappear }
            - zone_contains: { side: ours, zone: graveyard, card: Grizzly Bears }
            - opponent_life: 20
            - stack_empty: true
  - id: spectacle-spawn-of-mayhem
    puzzle: spectacle-spawn-of-mayhem
    run: cast Shock, then cast Spawn of Mayhem with Spectacle
    expect: opponent lost life gates the spectacle cast and Spawn of Mayhem resolves
    steps:
