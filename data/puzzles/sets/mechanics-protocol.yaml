      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: CastingTimeOption
            - zone_contains: { side: ours, zone: battlefield, card: Spawn of Mayhem }
            - zone_contains: { side: ours, zone: graveyard, card: Shock }
