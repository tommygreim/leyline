  - id: expend-roughshod-duo
    puzzle: expend-roughshod-duo
    run: cast Teapot Slinger to expend four, then target Grizzly Bears with Roughshod Duo
    expect: ExpendedMana is visible and Grizzly Bears becomes 3/3 from the Expend trigger
    steps:
