name: mechanics-warmup
description: Small arena-driven mechanic smoke suite focused on client-accepted mechanic surfaces.
scenarios:
  - id: omen-lifecycle
    puzzle: omen-riling-dawnbreaker
    run: cast Signaling Roar, create a Soldier, then shuffle Riling Dawnbreaker into the library
    expect: the Soldier reaches the battlefield and the Omen parent returns to the library
    steps:
      - cast_omen: Riling Dawnbreaker
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Soldier Token }
            - zone_not_contains: { side: ours, zone: hand, card: Riling Dawnbreaker }
            - stack_empty: true
  - id: adventure-lifecycle
    puzzle: adventure-test
    run: cast Pest Problem, then cast Ratcatcher Trainee from exile
    expect: two Rats and Ratcatcher Trainee reach the battlefield
    steps:
      - cast_adventure: Ratcatcher Trainee
      - resolve_stack: {}
      - expect:
          all:
            - zone_count_at_least: { side: ours, zone: battlefield, count: 9 }
            - zone_contains: { side: ours, zone: exile, card: Ratcatcher Trainee }
      - cast: { card: Ratcatcher Trainee, zone: exile }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Ratcatcher Trainee }
            - zone_not_contains: { side: ours, zone: exile, card: Ratcatcher Trainee }
            - stack_empty: true
  - id: kicker-burst
    puzzle: mechanic-kicker-burst
    run: cast Burst Lightning, choose kicker, target opponent
    expect: opponent life drops by 4 without relying on game over
    steps:
      - wait:
          action: { type: cast, card: Burst Lightning }
      - cast: Burst Lightning
      - choose: { optional_cost: kicker }
      - target: opponent
      - resolve_stack: {}
      - expect:
          all:
            - opponent_life: 16
            - stack_empty: true
  - id: kicker-unaffordable-recovery
    puzzle: kicker-unaffordable
    run: choose the unaffordable kicker branch, cancel payment, then cast normally
    expect: cancellation restores the spell and an empty stack; the subsequent normal cast deals two damage
    steps:
      - cast: Burst Lightning
      - choose: { optional_cost: kicker }
      - target: opponent
      - cancel_action: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Burst Lightning }
            - zone_count_at_least: { side: ours, zone: hand, count: 2 }
            - action: { type: cast, card: Burst Lightning }
            - opponent_life: 30
            - stack_empty: true
      - cast: Burst Lightning
      - choose: { cto_id: 0 }
      - target: opponent
      - resolve_stack: {}
      - expect:
          all:
            - opponent_life: 28
            - stack_empty: true
  - id: cycling-activate
    puzzle: mechanic-cycling-miscalculation
    run: activate Miscalculation cycling
    expect: Miscalculation leaves hand and Lightning Bolt is drawn
    steps:
      - wait:
          action: { type: activate, card: Miscalculation }
      - activate: { card: Miscalculation, zone: hand }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: ours, zone: hand, card: Miscalculation }
            - stack_empty: true
      - expect:
          zone_contains: { side: ours, zone: hand, card: Lightning Bolt }
  - id: prowess-buff
    puzzle: mechanic-prowess-buff
    run: cast Shock with Monastery Swiftspear on battlefield
    expect: Swiftspear has at least 2/3 stats this turn
    steps:
      - wait:
          action: { type: cast, card: Shock }
      - cast: Shock
      - target: opponent
      - resolve_stack: {}
      - expect:
          all:
            - battlefield_stats_at_least: { side: ours, card: Monastery Swiftspear, power: 2, toughness: 3 }
            - stack_empty: true
  - id: learn-lesson
    puzzle: learn-cram-session
    run: cast Cram Session and take Environmental Sciences from sideboard
    expect: Cram Session gains 4 life and the Lesson moves to hand
    steps:
      - wait:
          action: { type: cast, card: Cram Session }
      - cast: Cram Session
      - mana_type_choices: [black]
      - pass_until:
          prompt: SelectNReq
      - select_card: { side: ours, zone: sideboard, card: Environmental Sciences }
      - resolve_stack: {}
      - expect:
          all:
            - our_life: 24
            - zone_contains: { side: ours, zone: hand, card: Environmental Sciences }
            - zone_not_contains: { side: ours, zone: sideboard, card: Environmental Sciences }
            - annotation_seen: CardRevealed
            - annotation_seen: InstanceRevealedToOpponent
            - stack_empty: true
  - id: reconfigure-attach-unattach
    puzzle: reconfigure-rabbit-battery
    web:
      skip: Browser runner does not reach the expected board state for this mechanic — deterministic gap on the per-mechanic ledger.
    run: attach Rabbit Battery to Grizzly Bears, then unattach it
    expect: Grizzly Bears is 3/3 while equipped and returns to 2/2 after unattach
    steps:
      - wait:
          action: { type: activate, card: Rabbit Battery }
      - activate: { card: Rabbit Battery, ability_index: 0 }
      - target: { side: ours, zone: battlefield, card: Grizzly Bears }
      - expect:
          all:
            - battlefield_stats: { side: ours, card: Grizzly Bears, power: 3, toughness: 3 }
            - stack_empty: true
      - wait:
          action: { type: activate, card: Rabbit Battery }
      - activate: { card: Rabbit Battery, ability_index: 0 }
      - resolve_stack: {}
      - expect:
          all:
            - battlefield_stats: { side: ours, card: Grizzly Bears, power: 2, toughness: 2 }
