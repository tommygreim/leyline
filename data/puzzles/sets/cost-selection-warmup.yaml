name: cost-selection-warmup
description: Alternate costs, sacrifice/discard payments, and payment-selection smoke.
scenarios:
  - id: chained-paid-mana-filter
    puzzle: chained-paid-mana-filter
    run: chain Mountain through Rakdos Signet and Gruul Signet to cast Manalith
    expect: all three mana sources tap and Manalith resolves
    steps:
      - expect:
          action: { type: cast, card: Manalith }
      - cast: Manalith
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: battlefield, card: Manalith }
  - id: sacrifice-source-cost
    puzzle: sacrifice-cost-confirm
    run: activate Evolving Wilds, pay its self-sacrifice cost, and choose Forest
    expect: the self-sacrifice activation reaches library search and resolves
    steps:
      - expect:
          action: { type: activate, card: Evolving Wilds }
      - activate: Evolving Wilds
      - pass_until:
          prompt: { type: SearchReq }
      - search_cards: { side: ours, cards: [Forest] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Evolving Wilds }
            - zone_contains: { side: ours, zone: battlefield, card: Forest }
            - stack_empty: true
  - id: treasure-token
    puzzle: treasure-token
    native:
      xfail: Treasure mana is not surfaced as a usable cast payment path yet.
    run: cast Prosperous Innkeeper, then cast Lightning Bolt using the Treasure mana path
    expect: opponent takes damage and Innkeeper remains on battlefield
    steps:
      - expect:
          action: { type: cast, card: Prosperous Innkeeper }
      - cast: Prosperous Innkeeper
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: battlefield, card: Prosperous Innkeeper }
      - expect:
          action: { type: cast, card: Lightning Bolt }
      - cast: Lightning Bolt
      - target: opponent
      - resolve_stack: {}
      - expect:
          opponent_life: 3
  - id: sacrifice-mana-source
    puzzle: phyrexian-tower-sacrifice-mana
    run: cast Bad Moon with Phyrexian Tower as the only available mana source
    expect: the sacrifice pays for Bad Moon and both permanents reach their expected zones
    steps:
      - expect:
          action: { type: cast, card: Bad Moon }
      - cast: Bad Moon
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Bad Moon }
            - zone_contains: { side: ours, zone: graveyard, card: Grizzly Bears }
  - id: eaten-alive-sacrifice
    puzzle: eaten-alive
    native:
      xfail: Sacrifice additional-cost prompt sequencing is not driven by the native runner yet.
    run: cast Eaten Alive with the sacrifice additional-cost branch
    expect: Walking Corpse is sacrificed and Centaur Courser is exiled
    steps:
      - expect:
          action: { type: cast, card: Eaten Alive }
      - cast: Eaten Alive
      - choose: { cto_id: 1 }
      - target: { side: opponent, zone: battlefield, card: Centaur Courser }
      - select_cost: { zone: battlefield, cards: [Walking Corpse] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Walking Corpse }
            - zone_contains: { side: opponent, zone: exile, card: Centaur Courser }
  - id: mandatory-cost-mardu-outrider
    puzzle: mandatory-cost-mardu-outrider
    run: cast Mardu Outrider and discard Mountain as the mandatory cost
    expect: Mardu Outrider resolves and Mountain is discarded
    steps:
      - expect:
          action: { type: cast, card: Mardu Outrider }
      - cast: Mardu Outrider
      - select_cost: { zone: hand, cards: [Mountain] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Mardu Outrider }
            - zone_contains: { side: ours, zone: graveyard, card: Mountain }
  - id: jump-start-radical-idea
    puzzle: jump-start-radical-idea
    run: cast Radical Idea from graveyard by discarding Coral Merfolk
    expect: Coral Merfolk is discarded and Radical Idea leaves graveyard
    steps:
      - expect:
          action: { type: cast, card: Radical Idea }
      - cast: { card: Radical Idea, zone: graveyard, alt_cost: jump_start }
      - select_cost: { zone: hand, cards: [Coral Merfolk] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Coral Merfolk }
            - zone_not_contains: { side: ours, zone: graveyard, card: Radical Idea }
  - id: escape-glimpse-of-freedom
    puzzle: escape-glimpse-of-freedom
    native:
      xfail: Escape graveyard cast plus multi-card graveyard payment is not driven by the native runner yet.
    run: cast Glimpse of Freedom from hand, then escape the graveyard copy
    expect: escape exiles five graveyard cards and draws another card
    steps:
      - expect:
          action: { type: cast, card: Glimpse of Freedom }
      - cast: Glimpse of Freedom
      - resolve_stack: {}
      - expect:
          action: { type: cast, card: Glimpse of Freedom }
      - cast: { card: Glimpse of Freedom, zone: graveyard, alt_cost: escape }
      - select_cost: { zone: graveyard, cards: [Lightning Bolt, Counterspell, Llanowar Elves, Giant Growth, Grizzly Bears] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_count_at_least: { side: ours, zone: exile, count: 5 }
            - zone_count_at_least: { side: ours, zone: hand, count: 2 }
  - id: forage-camellia-exile
    puzzle: forage-camellia-exile
    run: activate Camellia by exiling three graveyard cards
    expect: three graveyard cards are exiled and Honored Dreyleader gets a counter
    steps:
      - expect:
          action: { type: activate, card: "Camellia, the Seedmiser" }
      - activate: "Camellia, the Seedmiser"
      - select_cost: { zone: graveyard, cards: [Grizzly Bears, Walking Corpse, Llanowar Elves] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_count_at_least: { side: ours, zone: exile, count: 3 }
            - battlefield_stats_at_least: { side: ours, card: Honored Dreyleader, power: 2, toughness: 2 }
  - id: forage-camellia-food
    puzzle: forage-camellia-food
    run: activate Camellia by sacrificing Golden Egg as Food
    expect: Golden Egg is sacrificed and Honored Dreyleader gets a counter
    steps:
      - expect:
          action: { type: activate, card: "Camellia, the Seedmiser" }
      - activate: "Camellia, the Seedmiser"
      - select_cost: { zone: battlefield, cards: [Golden Egg] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Golden Egg }
            - battlefield_stats_at_least: { side: ours, card: Honored Dreyleader, power: 3, toughness: 3 }
  - id: eaten-alive-sacrifice-lethal
    puzzle: eaten-alive-sacrifice-lethal
    native:
      skip: Terminal ratchet scenario is headless-only until native puzzle outcomes can preserve the client match.
    run: cast Eaten Alive by sacrificing Ornithopter, exile Centaur Courser, then attack for lethal
    expect: Ornithopter is sacrificed, Grizzly Bears survives to attack, and the opponent loses
    steps:
      - expect:
          action: { type: cast, card: Eaten Alive }
      - cast: Eaten Alive
      - choose: { cto_id: 1 }
      - target: { side: opponent, zone: battlefield, card: Centaur Courser }
      - select_cost: { zone: battlefield, cards: [Ornithopter] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Ornithopter }
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - zone_contains: { side: opponent, zone: exile, card: Centaur Courser }
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 8
      - attack: { cards: [Grizzly Bears] }
      - pass_until:
          winner: ours
          loser: opponent
          max_passes: 8
