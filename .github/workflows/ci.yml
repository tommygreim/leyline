name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.decide.outputs.run-heavy }}
    steps:
      - name: Decide whether this tree needs CI
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run-heavy', 'true')
              return
            }

            if (context.eventName === 'pull_request') {
              const internal = context.payload.pull_request.head.repo.full_name === context.payload.repository.full_name
              core.setOutput('run-heavy', String(internal))
              core.info(internal ? 'Internal PR: run CI' : 'Fork PR: skip privileged CI')
              return
            }

            const { owner, repo } = context.repo
            const current = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha })
            const { data: pulls } = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              { owner, repo, commit_sha: context.sha },
            )

            for (const pull of pulls.filter(pr => pr.merged_at)) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                status: 'success',
                head_sha: pull.head.sha,
                per_page: 10,
              })
              if (runs.data.workflow_runs.length === 0) continue

              const tested = await github.rest.git.getCommit({ owner, repo, commit_sha: pull.head.sha })
              if (tested.data.tree.sha === current.data.tree.sha) {
                core.setOutput('run-heavy', 'false')
                core.info(`Tree already passed in PR #${pull.number}: ${current.data.tree.sha}`)
                return
              }
            }

            core.setOutput('run-heavy', 'true')
            core.info(`No successful PR run found for tree ${current.data.tree.sha}; run CI`)

  gate:
    name: Gate (fmt + unit + board + coverage)
    needs: plan
    if: needs.plan.outputs.run-heavy == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.workers.max=2 -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
      LEYLINE_FORGE_M2_ROOT: ${{ github.workspace }}/.ci-forge-m2
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Read Forge revision
        id: forge-revision
        run: echo "sha=$(git rev-parse HEAD:forge)" >> "$GITHUB_OUTPUT"

      - name: Restore Forge Maven repository
        uses: actions/cache@v4
        with:
          path: ${{ env.LEYLINE_FORGE_M2_ROOT }}
          key: forge-${{ runner.os }}-${{ runner.arch }}-java21-${{ steps.forge-revision.outputs.sha }}

      - name: Install forge JARs
        run: just install-forge

      - name: Build
        run: just build

      - name: Test (unit + board)
        run: just test-gate

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gate
          path: '**/build/test-results/**/TEST-*.xml'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate
          path: '**/build/reports/jacoco/**/jacocoTestReport.xml'
          if-no-files-found: ignore
          retention-days: 7

  extended:
    name: Extended (integration + simclient + acceptance)
    needs: plan
    if: needs.plan.outputs.run-heavy == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.workers.max=2 -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
      LEYLINE_FORGE_M2_ROOT: ${{ github.workspace }}/.ci-forge-m2
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Read Forge revision
        id: forge-revision
        run: echo "sha=$(git rev-parse HEAD:forge)" >> "$GITHUB_OUTPUT"

      - name: Restore Forge Maven repository
        uses: actions/cache@v4
        with:
          path: ${{ env.LEYLINE_FORGE_M2_ROOT }}
          key: forge-${{ runner.os }}-${{ runner.arch }}-java21-${{ steps.forge-revision.outputs.sha }}

      - name: Install forge JARs
        run: just install-forge

      - name: Build
        run: just build

      - name: Test (integration)
        id: integration
        run: just test-integration
        continue-on-error: true

      - name: Test (simclient)
        id: simclient
        run: just test-simclient
        continue-on-error: true

      - name: Test (acceptance)
        id: acceptance
        run: just test-acceptance
        continue-on-error: true

      - name: Test (protocol contracts)
        id: conformance
        run: ./gradlew :engine:testConformance
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-extended
          path: '**/build/test-results/**/TEST-*.xml'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-extended
          path: '**/build/reports/jacoco/**/jacocoTestReport.xml'
          if-no-files-found: ignore
          retention-days: 7

      - name: Propagate test failures
        if: >-
          always() &&
          (steps.integration.outcome == 'failure' ||
           steps.simclient.outcome == 'failure' ||
           steps.acceptance.outcome == 'failure' ||
           steps.conformance.outcome == 'failure')
        run: exit 1

  report:
    name: Report
    needs: [plan, gate, extended]
    if: always() && needs.plan.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gradle/scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'ci-artifacts/**/TEST-*.xml'
          check_name: 'Test Results'
          comment_title: 'Test Results'
          deduplicate_classes_by_file_name: true

      - name: Generate CI report
        if: github.event_name == 'pull_request'
        run: |
          jacoco_args=""
          for f in $(find ci-artifacts -name 'jacocoTestReport.xml' 2>/dev/null); do
            jacoco_args="$jacoco_args --jacoco-xml $f"
          done
          test_dir_args=""
          for d in $(find ci-artifacts -type d -name 'test-results-*' 2>/dev/null); do
            test_dir_args="$test_dir_args --test-xml-dir $d"
          done
          python3 gradle/scripts/ci-report.py $jacoco_args $test_dir_args > ci-comment.md
          cat ci-comment.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: ci-comment.md
          header: ci-report
